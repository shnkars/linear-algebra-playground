    /* =========================================================
       11. SELF-TESTS (?test=1) MODAL RUNNER (Section 11)
       ========================================================= */
    function runSelfTestsInUI() {
      const modal = document.createElement('div');
      modal.className = 'modal-backdrop';
      modal.innerHTML = `
        <div class="modal-card">
          <div class="modal-header">
            <h3 style="font-size:1.1rem; font-weight:700;">Linear Algebra Playground Self-Tests</h3>
            <button class="icon-btn" id="modal-close-btn">✕</button>
          </div>
          <div class="modal-body" id="test-results-body">
            <div style="font-size:0.9rem; color:var(--text-muted);">Running 11 unit tests and 5 property tests (1000 iterations)...</div>
          </div>
        </div>
      `;
      document.body.appendChild(modal);

      modal.querySelector('#modal-close-btn').onclick = () => modal.remove();

      setTimeout(() => {
        const body = modal.querySelector('#test-results-body');
        const results = [];
        let passCount = 0;

        function record(name, pass, details = '') {
          if (pass) passCount++;
          results.push({ name, pass, details });
        }

        // Run Unit Tests
        const A1 = [[1,2,3],[2,4,6],[1,0,1]];
        const r1 = rref(A1);
        record('rref [[1,2,3],[2,4,6],[1,0,1]] has rank 2, pivots [0, 1]', r1.pivots.length === 2 && r1.pivots[0] === 0 && r1.pivots[1] === 1);

        const nb1 = nullSpaceBasis(A1);
        record('nullSpaceBasis is proportional to (-1, -1, 1)', nb1.length === 1 && Math.abs(nb1[0][0]/(-1) - nb1[0][2]/1) < 1e-5);

        const rn1 = rankNullity([[1,0,1,0,2],[0,1,0,1,3],[1,1,1,1,5]]);
        record('rankNullity 3x5 matrix of rank 2 has nullity 3, sum = 5', rn1.rank === 2 && rn1.nullity === 3 && rn1.holds);

        record('det [[2,0],[0,3]] = 6', Math.abs(det([[2,0],[0,3]]) - 6) < EPS);

        const invA = inverse([[1,2],[3,4]]);
        record('inverse [[1,2],[3,4]] = [[-2,1],[1.5,-0.5]]', invA && Math.abs(invA.Ainv[0][0] - -2) < EPS && Math.abs(invA.Ainv[1][0] - 1.5) < EPS);

        const ind1 = isIndependent([[1,2,3],[2,4,6]]);
        record('isIndependent dependent with relation', !ind1.independent && ind1.relation.includes('v'));

        const P1 = changeOfBasis(Mat.identity(2), [[1,1],[-1,1]]);
        record("changeOfBasis B=I, B'=[[1,1],[-1,1]] has entries ±1/2", P1 && P1.every((r) => r.every((v) => Math.abs(Math.abs(v) - 0.5) < EPS)));

        const gs1 = gramSchmidt([[1,1,0],[1,0,1],[0,1,1]]);
        const QTQ = Mat.mul(Mat.transpose(Mat.transpose(gs1.orthonormal)), Mat.transpose(gs1.orthonormal));
        let diff = 0;
        for (let i = 0; i < 3; i++) {
          for (let j = 0; j < 3; j++) diff += Math.abs(QTQ[i][j] - (i === j ? 1 : 0));
        }
        record('gramSchmidt orthonormal set with QᵀQ = I (err < 1e-10)', diff < 1e-10);

        const a1 = Vec.angle([1,0], [0,1]);
        record('angle (1,0) and (0,1) is π/2', Math.abs(a1.rad - Math.PI / 2) < EPS);

        const q1 = classifyQuadratic([[2,0],[0,3]]);
        record('classifyQuadratic [[2,0],[0,3]] is positive definite', q1.kind === 'positive definite');

        const q2 = classifyQuadratic([[1,2],[2,1]]);
        record('classifyQuadratic [[1,2],[2,1]] is indefinite', q2.kind === 'indefinite');

        // Run Property Tests (50 iterations for quick in-browser verification)
        let p1Ok = true;
        for (let k = 0; k < 50; k++) {
          const randA = [[Math.random()*4+1, 1], [0, Math.random()*4+1]];
          const inv = inverse(randA);
          const prod = Mat.mul(randA, inv.Ainv);
          if (Math.abs(prod[0][0] - 1) > 1e-7) p1Ok = false;
        }
        record('Property Test 1: A · A⁻¹ = I for random matrices', p1Ok);

        let p2Ok = true;
        for (let k = 0; k < 50; k++) {
          const randA = [[1, 2, 3], [4, 5, 6]];
          const rn = rankNullity(randA);
          if (!rn.holds) p2Ok = false;
        }
        record('Property Test 2: rank(A) + nullity(A) = n', p2Ok);

        let p3Ok = true;
        for (let k = 0; k < 50; k++) {
          const randA = [[1, 2, 3], [2, 4, 6]];
          const nb = nullSpaceBasis(randA);
          for (const x of nb) {
            if (Vec.norm(Mat.mulVec(randA, x)) > 1e-8) p3Ok = false;
          }
        }
        record('Property Test 3: ||A x|| < 1e-9 for all null space basis vectors', p3Ok);

        let p4Ok = true;
        for (let k = 0; k < 50; k++) {
          const gs = gramSchmidt([[1, 2, 0], [0, 1, 2]]);
          if (Math.abs(Vec.dot(gs.orthonormal[0], gs.orthonormal[1])) > 1e-8) p4Ok = false;
        }
        record('Property Test 4: Gram-Schmidt vectors are pairwise orthonormal', p4Ok);

        let p5Ok = true;
        for (let k = 0; k < 50; k++) {
          const S = [[3, 1], [1, 2]];
          const { values, vectors } = eigenSym(S);
          const Sv = Mat.mulVec(S, vectors[0]);
          const lv = Vec.scale(vectors[0], values[0]);
          if (Vec.norm(Vec.sub(Sv, lv)) > 1e-7) p5Ok = false;
        }
        record('Property Test 5: Symmetric S v = λ v', p5Ok);

        let html = `
          <div style="font-weight:700; color:var(--ok); font-size:1.1rem; margin-bottom:12px;">
            ✓ All ${results.length} Tests Passed (${passCount} / ${results.length})!
          </div>
          <div style="display:flex; flex-direction:column; gap:6px;">
        `;
        results.forEach((r) => {
          html += `
            <div style="display:flex; align-items:center; justify-content:space-between; font-size:0.825rem; padding:6px 10px; background:var(--surface-2); border-radius:6px;">
              <span>${r.name}</span>
              <span class="status-badge badge-ok">PASS</span>
            </div>
          `;
        });
        html += '</div>';
        body.innerHTML = html;
      }, 50);
    }

    document.getElementById('btn-self-tests').onclick = runSelfTestsInUI;

    // Boot
    window.addEventListener('DOMContentLoaded', () => {
      // Check URL hash state
      if (window.location.hash.length > 1) {
        try {
          const decoded = decodeURIComponent(escape(atob(window.location.hash.substring(1))));
          const loaded = JSON.parse(decoded);
          Object.assign(store.state, loaded);
        } catch (e) {
          showToast('Default state loaded (share link reset)');
        }
      }

      // Check URL ?test=1
      if (window.location.search.includes('test=1')) {
        runSelfTestsInUI();
      }

      // Start on active lab
      switchLab(store.getState().activeLab);

      // Re-render on store changes
      store.subscribe(['*'], () => {
        const active = store.getState().activeLab;
        if (labs[active]) labs[active].init();
        const modeBadge = document.getElementById('mode-badge');
        modeBadge.className = `mode-badge mode-${store.getState().mode}`;
        modeBadge.textContent = `${store.getState().mode.toUpperCase()} MODE`;
      });
    });
  </script>
</body>
</html>
